<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
  }
  #stage {
    position: relative;
    width: 100%; height: 100%;
  }
  #bubble {
    position: absolute;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    background: #fff;
    color: #2a2a2a;
    border: 2px solid #2a2a2a;
    font: 11px/1.3 monospace;
    padding: 5px 8px;
    border-radius: 8px;
    white-space: normal;
    max-width: 210px;
    width: max-content;
    text-align: center;
    opacity: 0;
    transition: opacity .2s, background .2s, color .2s, border-color .2s;
  }
  #bubble.show { opacity: 1; }
  body.dark #bubble {
    background: #26262b;
    color: #eee;
    border-color: #eee;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="bubble"></div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const bubble = document.getElementById('bubble');

    ipcRenderer.on('bubble-update', (_e, { text, show }) => {
      bubble.textContent = text || '';
      bubble.classList.toggle('show', !!show);
    });

    ipcRenderer.on('set-theme', (_e, theme) => {
      document.body.classList.toggle('dark', theme === 'dark');
    });
  </script>
</body>
</html>
